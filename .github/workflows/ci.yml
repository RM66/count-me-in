name: CI

on:
  pull_request:
  push:
    branches: [master]

# A force-push supersedes the run already in flight; keep only the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    # One job per task instead of a single chained run: a lint failure still
    # reports the type and test results, so a PR gets every problem in one pass.
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, check-types, test]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.14

      - name: Set up Go
        if: matrix.task == 'test'
        uses: actions/setup-go@v5
        with:
          # Keep in sync with "go" in apps/web/go.mod.
          go-version: '1.27'
          cache-dependency-path: apps/web/go.sum

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.task }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.task }}-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run ${{ matrix.task }}

  # The Go API is a separate module with its own toolchain. scripts/build.sh
  # runs the whole verification set: build + vet + unit tests, per-file builds
  # of the Vercel entry points (bracket route dirs cannot appear in a ./...
  # pattern), and gofmt. Generated artifacts must stay fresh (ADR-016): the
  # steps below regenerate everything derivable — i18n copy, both OpenAPI
  # specs, the Go constants, the oapi-codegen output — and fail if any
  # committed copy is stale.
  go-api:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keep in sync with "go" in apps/web/go.mod.
          go-version: '1.27'
          cache-dependency-path: apps/web/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.14

      - name: Install JS dependencies
        # The generators import zod/@repo/contracts — node_modules must exist
        # explicitly, not via Bun's implicit auto-install.
        run: bun install --frozen-lockfile

      - name: Generate i18n, OpenAPI specs and Go constants
        working-directory: apps/web
        run: |
          bun run generate:i18n
          bun run generate:openapi
          bun run generate:constants

      - name: Generate oapi-codegen artifacts
        # go:generate directives pin oapi-codegen via `go run …@v2.5.0`,
        # so no separate install step is needed.
        working-directory: apps/web
        run: go generate ./pkg/api/...

      - name: Check for uncommitted generated changes
        run: git diff --exit-code apps/web/pkg/i18n/translations_gen.go apps/web/pkg/contracts/constants_gen.go apps/web/openapi.yaml apps/web/pkg/api/gen

      - name: Build, vet, test
        working-directory: apps/web
        run: sh scripts/build-go.sh

  # Apply DB migrations only on the production deploy trigger (push to main),
  # after all checks pass. Running them in the Vercel build command would be
  # wrong: builds are cached (migrations could be skipped) and preview deploys
  # would run them against the production database. drizzle-kit migrate is
  # idempotent — it tracks applied migrations in the DB, so re-runs are no-ops.
  migrate:
    name: Apply DB migrations
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
    steps:
      # fetch-depth: 2 so HEAD^ (the parent commit) is available for the
      # migration-change check below. The default depth-1 clone has no parent,
      # which would silently skip migrations on every push.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Skip the migrate step when this push didn't touch any migration files.
      # On the very first push (no parent commit) treat everything as changed so
      # migrations still run.
      - name: Check for migration changes
        id: changes
        run: |
          if ! git rev-parse --verify -q HEAD^ >/dev/null; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD -- packages/db/drizzle/ | grep -q .; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply migrations
        if: steps.changes.outputs.migrations == 'true'
        working-directory: packages/db
        run: bun run db:migrate

  # Keep the QStash schedule for the demo seed refresh in sync with the code
  # (ADR-012). The schedule lives in Upstash, not in this repo, so left alone
  # it would silently drift (or vanish on a fresh account). ensure-qstash.ts is
  # idempotent, so every push to master is also a reconciliation.
  # Requires repo secrets: APP_URL (production origin), QSTASH_TOKEN and
  # QSTASH_URL (the instance is regional — without the URL the SDK would
  # default to the global endpoint, not the one this token belongs to).
  qstash:
    name: Sync QStash schedule
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      APP_URL: ${{ secrets.APP_URL }}
      QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
      QSTASH_URL: ${{ secrets.QSTASH_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run qstash:schedules
        working-directory: apps/web
