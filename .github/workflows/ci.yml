name: CI

on:
  pull_request:
  push:
    branches: [master]

# A force-push supersedes the run already in flight; keep only the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    # One job per task instead of a single chained run: a lint failure still
    # reports the type and test results, so a PR gets every problem in one pass.
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    services:
      # The TS booking integration test and the Python API suite need a
      # real Postgres + Redis. Without them the suites silently SKIP and
      # the booking invariants go unverified.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: countmein
          POSTGRES_PASSWORD: countmein
          POSTGRES_DB: countmein
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # Upstash REST emulator over the service Redis (ADR-025): covers
      # /pipeline and SSE /subscribe; the dedicated tier keeps parity.
      redis-http:
        image: ghcr.io/coriou/up-redis:1.0.1
        env:
          UPREDIS_TOKEN: dev-upstash-token
          UPREDIS_REDIS_URL: redis://redis:6379
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -fsS http://localhost:8080/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://countmein:countmein@localhost:5432/countmein
      REDIS_URL: redis://localhost:6379
      UPSTASH_RT_EMULATOR_URL: http://localhost:8080
      UPSTASH_RT_EMULATOR_TOKEN: dev-upstash-token
      # Tier-2 live-delivery tests — dedicated instance, absent secrets
      # skip. Accepts either the REST https endpoint or the Upstash
      # redis(s):// TCP URL (its password is the REST token). Named
      # UPSTASH_RT_LIVE_* on purpose: live creds under
      # REDIS_REST_URL/REDIS_URL would make vitest emit into production.
      UPSTASH_RT_LIVE_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_RT_LIVE_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # `build` runs `next build`: RSC
        # boundary errors, next.config.js issues and build-time env
        # problems otherwise surface only on the Vercel deploy.
        task: [lint, check-types, test, build]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.14

      # uv only for the test task: `bun run test` is vitest-only — pytest
      # runs once, in the python-api job — but the TS integration tests
      # need the CI Postgres migrated, and db:migrate:py shells out to uv.
      - name: Set up uv
        if: matrix.task == 'test'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.task }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.task }}-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Migrate the ephemeral CI Postgres before integration tests: the
      # tests insert organizers/services/slots directly and SKIP (FAIL in
      # CI, see requirePostgres) when the schema is missing.
      - name: Migrate CI database
        if: matrix.task == 'test'
        working-directory: apps/web
        run: bun run db:migrate:py

      - run: bun run ${{ matrix.task }}

      # The plain `test` task above runs vitest without coverage
      # (fast locally, where integration tests skip without docker and
      # would trip the thresholds). The thresholds live in the vitest
      # configs and are enforced here, against the migrated CI database.
      - name: TS coverage thresholds
        if: matrix.task == 'test'
        run: |
          bun run --cwd apps/web test:coverage
          bun run --cwd packages/contracts test:coverage

  # Formatting and dead-code hygiene: neither
  # prettier --check nor knip ran in CI, so formatting drift and unused
  # exports accumulated silently.
  hygiene:
    name: Format & dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Prettier check
        run: bun run format:check

      - name: Knip (unused exports)
        run: bun run knip

  # The Python API (ADR-021). Same services as the verify job: the
  # pytest suite includes Postgres integration tests (db, routes,
  # parity) that SKIP locally but FAIL in CI when the database is
  # missing.
  python-api:
    name: Python API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: countmein
          POSTGRES_PASSWORD: countmein
          POSTGRES_DB: countmein
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://countmein:countmein@localhost:5432/countmein
      REDIS_URL: redis://localhost:6379
      # No realtime REST vars here on purpose: the emit lives in the
      # Next.js route — pytest's payload rides trigger_revalidation,
      # which skips without APP_URL/AUTH_SECRET and is mocked elsewhere.
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install JS dependencies
        # The generators import zod/@repo/contracts — node_modules must exist
        # explicitly, not via Bun's implicit auto-install.
        run: bun install --frozen-lockfile

      - name: Migrate CI database
        # Alembic owns the schema (Phase 1).
        working-directory: apps/web
        run: bun run db:migrate:py

      - name: Check models match migrations
        # `alembic check` diffs the SQLAlchemy 2.0 metadata against the
        # schema the migrations just built — catches model/migration drift
        # that no parser-based test sees.
        working-directory: apps/web
        run: uv run alembic check

      - name: Generate Python artifacts
        # i18n copy, the OpenAPI spec, the constants and the Pydantic
        # models — all derived from the Zod manifests.
        working-directory: apps/web
        run: bun run generate:py

      - name: Check for uncommitted generated changes
        # porcelain (not git diff): a newly generated file the commit
        # does not know about is drift too — diff alone would miss it.
        run: test -z "$(git status --porcelain -- apps/web/api/_lib apps/web/openapi.yaml)"

      - name: Check uv lock freshness
        working-directory: apps/web
        run: uv lock --check

      - name: Check requirements.txt freshness
        # Vercel installs requirements.txt, uv owns the lock — the export
        # must stay in sync (same comparison as the Phase 2 gate).
        working-directory: apps/web
        run: |
          T=$(mktemp)
          uv export --no-dev --no-hashes --no-emit-project -o "$T"
          grep -v '^#' "$T" > "$T.body"
          grep -v '^#' requirements.txt > "$T.want"
          diff "$T.body" "$T.want"

      - name: Lint and type-check
        working-directory: apps/web
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

      - name: Install oasdiff
        # Pinned go-free binary release (ADR-021): the contract check
        # compares the Zod spec with the FastAPI-emitted one. Keep the
        # version in sync with the local dev tool.
        run: |
          OASDIFF_VERSION=v1.32.1
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin oasdiff
          oasdiff --version

      - name: Contract check
        # Bidirectional breaking-diff = equivalence at the breaking
        # level; the route-set pytest pins the exact set.
        working-directory: apps/web
        run: |
          uv run python scripts/export-py-openapi.py
          oasdiff breaking openapi.yaml openapi.py.yaml --fail-on ERR
          oasdiff breaking openapi.py.yaml openapi.yaml --fail-on ERR

      - name: Run pytest suite
        # Via the turbo task so the generate:py dependency (models,
        # constants, i18n, spec) is part of the cache key.
        working-directory: apps/web
        run: bun run test:py

  # E2E smoke: four scenarios against
  # the dev topology — `next dev` + the Python API (uvicorn, ADR-021) +
  # real Postgres/Redis. Separate from the unit matrix: it boots two
  # servers and needs the demo seed for the /demo scenario.
  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: countmein
          POSTGRES_PASSWORD: countmein
          POSTGRES_DB: countmein
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://countmein:countmein@localhost:5432/countmein
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: e2e-test-secret-not-production
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_TELEGRAM_CLIENT_ID: '8998312585'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up uv
        # The API side of the dev topology is the Python app
        # (dev:api:py) — playwright.config.ts boots uvicorn.
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - run: bun install --frozen-lockfile

      # bunx resolves the workspace's playwright bin only after node_modules
      # exists; run it earlier and it installs the *registry* playwright, whose
      # browser revision won't match the @playwright/test the tests run.
      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Migrate CI database
        # Alembic owns the schema (Phase 1).
        working-directory: apps/web
        run: bun run db:migrate:py

      - name: Seed demo organizer
        working-directory: apps/web
        run: bun run db:seed:demo:py

      - name: Compose REDIS_REST_URL (realtime e2e)
        # E2E keeps dedicated-Upstash parity; absent secrets skip the
        # spec (locally the compose emulator serves the same purpose).
        # Accepts the same two shapes realtimeRestConfig() resolves: an
        # http(s) REST endpoint (+ RT_TOKEN or embedded userinfo) or an
        # Upstash TCP URL redis(s)://…:token@*.upstash.io whose password
        # IS the REST token — either console flavor works as the secret.
        # Built with a URL parser + percent-encoding, not sed — a token
        # containing `/`, `?`, `@`, `|` must survive the splice.
        env:
          RT_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          RT_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -n "$RT_URL" ]; then
            bun -e '
              const u = new URL(process.env.RT_URL.trim());
              const token = process.env.RT_TOKEN ||
                decodeURIComponent(u.password || u.username);
              const tcp = (u.protocol === "redis:" || u.protocol === "rediss:") &&
                u.hostname.endsWith(".upstash.io");
              const rest = u.protocol === "http:" || u.protocol === "https:";
              if (!tcp && !rest) {
                throw new Error("UPSTASH_REDIS_REST_URL is neither http(s) nor an Upstash redis(s):// URL");
              }
              if (!token) {
                throw new Error("no realtime REST token — set UPSTASH_REDIS_REST_TOKEN or embed the password in the URL");
              }
              const origin = tcp ? `https://${u.hostname}` : u.origin;
              const composed = new URL(origin);
              console.log(`REDIS_REST_URL=${composed.protocol}//:${encodeURIComponent(token)}@${composed.host}`);
            ' >> "$GITHUB_ENV"
          fi

      - name: Run E2E smoke
        working-directory: apps/web
        run: bun run test:e2e

  # Apply DB migrations only on the production deploy trigger (push to main),
  # after all checks pass. Running them in the Vercel build command would be
  # wrong: builds are cached (migrations could be skipped) and preview deploys
  # would run them against the production database. `alembic upgrade head`
  # is idempotent — it tracks applied revisions in the DB, so re-runs
  # are no-ops.
  migrate:
    name: Apply DB migrations
    runs-on: ubuntu-latest
    needs: [verify, python-api, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
    steps:
      # fetch-depth: 2 so HEAD^ (the parent commit) is available for the
      # migration-change check below. The default depth-1 clone has no parent,
      # which would silently skip migrations on every push.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Skip the migrate step when this push didn't touch any migration files.
      # On the very first push (no parent commit) treat everything as changed so
      # migrations still run.
      - name: Check for migration changes
        id: changes
        run: |
          if ! git rev-parse --verify -q HEAD^ >/dev/null; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD -- apps/web/alembic/ | grep -q .; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.changes.outputs.migrations == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Apply migrations
        if: steps.changes.outputs.migrations == 'true'
        working-directory: apps/web
        run: bun run db:migrate:py

  # Keep the QStash schedule for the demo seed refresh in sync with the code
  # (ADR-012). The schedule lives in Upstash, not in this repo, so left alone
  # it would silently drift (or vanish on a fresh account). ensure-qstash.ts is
  # idempotent, so every push to master is also a reconciliation.
  # Requires repo secrets: APP_URL (production origin), QSTASH_TOKEN and
  # QSTASH_URL (the instance is regional — without the URL the SDK would
  # default to the global endpoint, not the one this token belongs to).
  qstash:
    name: Sync QStash schedule
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      APP_URL: ${{ secrets.APP_URL }}
      QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
      QSTASH_URL: ${{ secrets.QSTASH_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with "packageManager" in package.json.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run qstash:schedules
        working-directory: apps/web
