services:
  postgres:
    image: postgres:17
    container_name: countmein_postgres
    environment:
      POSTGRES_USER: countmein
      POSTGRES_PASSWORD: countmein
      POSTGRES_DB: countmein
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U countmein -d countmein']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: countmein_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
