openapi: 3.1.0
info:
  title: CountMeIn API
  description: API for group booking, organizer cabinet management, and notifications.
  version: 1.0.0
servers:
  - url: https://countmein.group
    description: Production
  - url: http://localhost:3000
    description: Local development
paths:
  /api/auth/telegram-guest:
    post:
      summary: Verify Telegram login widget data and mint a single-use guest ticket
      operationId: telegramGuest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramWidgetPayload"
      responses:
        "200":
          description: Guest ticket issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestTicketResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/telegram-signup:
    post:
      summary: Verify Telegram login widget data and mint an organizer signup ticket
      operationId: telegramSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramWidgetPayload"
      responses:
        "200":
          description: Auth ticket issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTicketResponse"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/organizers:
    post:
      summary: Register a new organizer using an auth ticket
      operationId: registerOrganizer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterOrganizerInput"
      responses:
        "201":
          description: Organizer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registered"
        "400":
          $ref: "#/components/responses/InvalidIssuesBody"
        "409":
          description: Slug already taken
  /api/organizers/me:
    get:
      summary: Get authenticated organizer profile
      operationId: getMyProfile
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current organizer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Update organizer profile
      operationId: updateMyProfile
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizerProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerEnvelope"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Demo account is read-only
  /api/organizers/me/language:
    patch:
      summary: Update organizer language preference
      operationId: updateMyLanguage
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizerLanguageInput"
      responses:
        "204":
          description: Language updated
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/organizers/me/avatar:
    post:
      summary: Mint signed upload URL for avatar image
      operationId: createAvatarUploadTarget
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAvatarUploadInput"
      responses:
        "200":
          description: Signed upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadTarget"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/organizers/me/service-photo:
    post:
      summary: Mint signed upload URL for service cover photo
      operationId: createServicePhotoUploadTarget
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServicePhotoUploadInput"
      responses:
        "200":
          description: Signed upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadTarget"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/services:
    post:
      summary: Create a service
      operationId: createService
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceInput"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEnvelope"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Demo account is read-only
  /api/services/{id}:
    put:
      summary: Update a service
      operationId: updateService
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceInput"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceEnvelope"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Demo account is read-only
        "404":
          description: Service not found
    delete:
      summary: Delete a service
      operationId: deleteService
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ServiceID"
      responses:
        "200":
          description: Service deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedServiceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Demo account is read-only
        "404":
          description: Service not found
  /api/slots:
    post:
      summary: Create a time slot
      operationId: createSlot
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimeSlotInput"
      responses:
        "201":
          description: Slot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotEnvelope"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Demo account is read-only
  /api/slots/{id}:
    put:
      summary: Update a time slot
      operationId: updateSlot
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimeSlotInput"
      responses:
        "200":
          description: Slot updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotEnvelope"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Demo account is read-only
    delete:
      summary: Delete a time slot
      operationId: deleteSlot
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Slot deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedSlotEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Demo account is read-only
        "404":
          description: Slot not found
  /api/bookings:
    post:
      summary: Guest creates a booking (atomic reserve)
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingInput"
      responses:
        "201":
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestBookingEnvelope"
        "400":
          $ref: "#/components/responses/InvalidBody"
        "403":
          description: Demo account is read-only
        "409":
          description: Slot sold out, capacity exceeded, or duplicate booking (one active
            booking per guest per slot)
  /api/bookings/lookup:
    post:
      summary: Look up guest bookings with ticket
      operationId: lookupBookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupBookingsInput"
      responses:
        "200":
          description: Guest bookings list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestBookingsEnvelope"
  /api/bookings/cancel:
    post:
      summary: Guest cancels booking via manageToken
      operationId: cancelBookingByToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingByTokenInput"
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestBookingEnvelope"
        "404":
          description: Booking not found
  /api/bookings/cancel-by-organizer:
    post:
      summary: Organizer cancels booking from cabinet
      operationId: cancelBookingByOrganizer
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingByOrganizerInput"
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Demo account is read-only
        "404":
          description: Booking not found
  /api/jobs/{queue}:
    post:
      summary: Upstash QStash webhook consumer
      operationId: runJob
      parameters:
        - name: queue
          in: path
          required: true
          schema:
            type: string
            enum:
              - booking.created
              - booking.cancelled
              - demo.refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BookingCreatedJob"
                - $ref: "#/components/schemas/BookingCancelledJob"
                - type: object
                  description: demo.refresh carries no payload
      responses:
        "200":
          description: Job succeeded (including unreachable recipient — no retry)
        "400":
          description: Invalid payload or signature
        "404":
          description: Unknown queue
        "500":
          description: Internal error (triggers QStash retry)
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-authjs.session-token
      description: "Auth.js session cookie: `__Secure-authjs.session-token` in
        production, `authjs.session-token` in local development."
  responses:
    InvalidBody:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidBody"
    InvalidIssuesBody:
      description: Validation error (field issues)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidIssuesBody"
    Unauthorized:
      description: Authentication required or invalid ticket
  schemas:
    AppLocale:
      type: string
      enum:
        - en
        - de
        - es
        - fr
        - pt
        - ru
        - ar
        - ja
    AuthTicket:
      type: string
      minLength: 20
      maxLength: 200
    AuthTicketPayload:
      type: object
      properties:
        messenger:
          $ref: "#/components/schemas/Messenger"
        messengerId:
          $ref: "#/components/schemas/MessengerID"
        displayName:
          type: string
        photoUrl:
          type: string
          format: uri
        messengerLogin:
          type: string
      required:
        - messenger
        - messengerId
        - displayName
    AuthTicketResponse:
      type: object
      properties:
        ticket:
          $ref: "#/components/schemas/AuthTicket"
        organizerExists:
          type: boolean
      required:
        - ticket
        - organizerExists
    AvatarUploadSize:
      type: integer
      minimum: 1
      maximum: 1048576
    BookingCancelledJob:
      type: object
      properties:
        bookingId:
          $ref: "#/components/schemas/UUID"
        cancelledBy:
          $ref: "#/components/schemas/CancelActor"
      required:
        - bookingId
        - cancelledBy
    BookingCreatedJob:
      type: object
      properties:
        bookingId:
          $ref: "#/components/schemas/UUID"
        recipient:
          $ref: "#/components/schemas/NotificationRecipient"
      required:
        - bookingId
        - recipient
    BookingEnvelope:
      type: object
      properties:
        booking:
          $ref: "#/components/schemas/BookingRecord"
      required:
        - booking
    BookingRecord:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        timeSlotId:
          $ref: "#/components/schemas/UUID"
        status:
          $ref: "#/components/schemas/BookingStatus"
        seats:
          $ref: "#/components/schemas/Seats"
        guestName:
          $ref: "#/components/schemas/DisplayName"
        guestMessenger:
          $ref: "#/components/schemas/Messenger"
        guestMessengerId:
          type: string
        guestMessengerLogin:
          anyOf:
            - type: string
            - type: "null"
        selectedOptions:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        createdAt:
          type: string
      required:
        - id
        - timeSlotId
        - status
        - seats
        - guestName
        - guestMessenger
        - guestMessengerId
        - guestMessengerLogin
        - selectedOptions
        - createdAt
    BookingStatus:
      type: string
      enum:
        - confirmed
        - cancelled
    CancelActor:
      type: string
      enum:
        - guest
        - organizer
    CancelBookingByOrganizerInput:
      type: object
      properties:
        bookingId:
          $ref: "#/components/schemas/UUID"
      required:
        - bookingId
    CancelBookingByTokenInput:
      type: object
      properties:
        manageToken:
          $ref: "#/components/schemas/ManageToken"
      required:
        - manageToken
    Capacity:
      type: integer
      minimum: 1
      maximum: 100000
    Contact:
      type: string
      minLength: 1
      maxLength: 300
    CreateAvatarUploadInput:
      type: object
      properties:
        contentType:
          $ref: "#/components/schemas/ImageContentType"
        size:
          $ref: "#/components/schemas/AvatarUploadSize"
      required:
        - contentType
        - size
    CreateBookingInput:
      type: object
      properties:
        serviceId:
          $ref: "#/components/schemas/ServiceID"
        timeSlotId:
          $ref: "#/components/schemas/UUID"
        seats:
          $ref: "#/components/schemas/Seats"
        guestName:
          $ref: "#/components/schemas/DisplayName"
        guestTicket:
          $ref: "#/components/schemas/AuthTicket"
        selectedOptions:
          $ref: "#/components/schemas/SelectedOptions"
        guestLocale:
          default: en
          $ref: "#/components/schemas/AppLocale"
      required:
        - serviceId
        - timeSlotId
        - seats
        - guestName
        - guestTicket
    CreateServiceInput:
      type: object
      properties:
        title:
          $ref: "#/components/schemas/DisplayName"
        description:
          $ref: "#/components/schemas/ServiceDescription"
        location:
          $ref: "#/components/schemas/Location"
        contact:
          $ref: "#/components/schemas/Contact"
        defaultPrice:
          $ref: "#/components/schemas/PriceText"
        defaultCapacity:
          $ref: "#/components/schemas/Capacity"
        defaultDurationMinutes:
          $ref: "#/components/schemas/DurationMinutes"
        maxSeatsPerBooking:
          $ref: "#/components/schemas/MaxSeatsPerBooking"
        options:
          $ref: "#/components/schemas/OptionsList"
        optionsSelectMode:
          $ref: "#/components/schemas/OptionsSelectMode"
        photoUrl:
          $ref: "#/components/schemas/URL"
      required:
        - title
        - defaultPrice
        - defaultCapacity
        - defaultDurationMinutes
        - maxSeatsPerBooking
    CreateServicePhotoUploadInput:
      type: object
      properties:
        contentType:
          $ref: "#/components/schemas/ImageContentType"
        size:
          $ref: "#/components/schemas/ServicePhotoUploadSize"
      required:
        - contentType
        - size
    CreateTimeSlotInput:
      type: object
      properties:
        serviceId:
          $ref: "#/components/schemas/ServiceID"
        startsAt:
          $ref: "#/components/schemas/SlotStartsAt"
        durationMinutes:
          $ref: "#/components/schemas/DurationMinutes"
        capacity:
          $ref: "#/components/schemas/Capacity"
        price:
          $ref: "#/components/schemas/PriceText"
      required:
        - serviceId
        - startsAt
        - durationMinutes
        - capacity
    DeletedServiceEnvelope:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ServiceID"
      required:
        - id
    DeletedSlotEnvelope:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
      required:
        - id
    DisplayName:
      type: string
      minLength: 1
      maxLength: 100
    DurationMinutes:
      type: integer
      minimum: 1
      maximum: 1440
    ErrorBody:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        seatsLeft:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        maxSeats:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - error
      additionalProperties: {}
    GuestBooking:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        status:
          $ref: "#/components/schemas/BookingStatus"
        seats:
          $ref: "#/components/schemas/Seats"
        guestName:
          $ref: "#/components/schemas/DisplayName"
        selectedOptions:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        createdAt:
          type: string
        manageToken:
          $ref: "#/components/schemas/ManageToken"
        slot:
          $ref: "#/components/schemas/TimeSlotRecord"
        service:
          $ref: "#/components/schemas/ServiceRecord"
        organizer:
          $ref: "#/components/schemas/PublicOrganizer"
      required:
        - id
        - status
        - seats
        - guestName
        - selectedOptions
        - createdAt
        - manageToken
        - slot
        - service
        - organizer
    GuestBookingEnvelope:
      type: object
      properties:
        booking:
          $ref: "#/components/schemas/GuestBooking"
      required:
        - booking
    GuestBookingsEnvelope:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/GuestBooking"
      required:
        - bookings
    GuestTicketResponse:
      type: object
      properties:
        ticket:
          $ref: "#/components/schemas/AuthTicket"
        messenger:
          $ref: "#/components/schemas/Messenger"
        messengerId:
          $ref: "#/components/schemas/MessengerID"
        displayName:
          type: string
      required:
        - ticket
        - messenger
        - messengerId
        - displayName
    ImageContentType:
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/webp
    ImageUploadTarget:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
        publicUrl:
          type: string
          format: uri
        expiresAt:
          type: string
      required:
        - uploadUrl
        - publicUrl
        - expiresAt
    InvalidBody:
      type: object
      properties:
        error:
          type: string
        details:
          $ref: "#/components/schemas/ValidationErrors"
      required:
        - error
        - details
    InvalidIssuesBody:
      type: object
      properties:
        error:
          type: string
        issues:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - error
        - issues
    Location:
      type: string
      minLength: 1
      maxLength: 300
    LoginLinkPayload:
      type: object
      properties:
        organizerId:
          $ref: "#/components/schemas/UUID"
        next:
          type: string
          pattern: ^\/.*
      required:
        - organizerId
        - next
    LookupBookingsInput:
      type: object
      properties:
        guestTicket:
          $ref: "#/components/schemas/AuthTicket"
      required:
        - guestTicket
    ManageToken:
      type: string
      minLength: 10
      maxLength: 200
    MaxSeatsPerBooking:
      type: integer
      minimum: 1
      maximum: 1000
    Messenger:
      type: string
      enum:
        - telegram
    MessengerID:
      type: string
      minLength: 1
      maxLength: 100
    NotificationRecipient:
      type: string
      enum:
        - organizer
        - guest
    OptionLabel:
      type: string
      minLength: 1
      maxLength: 100
    OptionsList:
      minItems: 1
      maxItems: 50
      type: array
      items:
        $ref: "#/components/schemas/OptionLabel"
    OptionsSelectMode:
      type: string
      enum:
        - single
        - multi
    OrganizerDescription:
      type: string
      maxLength: 4000
    OrganizerEnvelope:
      type: object
      properties:
        organizer:
          $ref: "#/components/schemas/OrganizerProfile"
      required:
        - organizer
    OrganizerProfile:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          $ref: "#/components/schemas/DisplayName"
        messenger:
          $ref: "#/components/schemas/Messenger"
        messengerId:
          type: string
        timezone:
          $ref: "#/components/schemas/Timezone"
        description:
          anyOf:
            - type: string
            - type: "null"
        photoUrl:
          anyOf:
            - type: string
            - type: "null"
        location:
          anyOf:
            - type: string
            - type: "null"
        contact:
          anyOf:
            - type: string
            - type: "null"
        language:
          $ref: "#/components/schemas/AppLocale"
        createdAt:
          type: string
        isDemo:
          type: boolean
      required:
        - id
        - slug
        - name
        - messenger
        - messengerId
        - timezone
        - description
        - photoUrl
        - location
        - contact
        - language
        - createdAt
        - isDemo
    PriceText:
      type: string
      minLength: 1
      maxLength: 50
    PublicOrganizer:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          $ref: "#/components/schemas/DisplayName"
        timezone:
          $ref: "#/components/schemas/Timezone"
        description:
          anyOf:
            - type: string
            - type: "null"
        photoUrl:
          anyOf:
            - type: string
            - type: "null"
        location:
          anyOf:
            - type: string
            - type: "null"
        contact:
          anyOf:
            - type: string
            - type: "null"
        isDemo:
          type: boolean
      required:
        - id
        - slug
        - name
        - timezone
        - description
        - photoUrl
        - location
        - contact
        - isDemo
    RegisterOrganizerInput:
      type: object
      properties:
        ticket:
          $ref: "#/components/schemas/AuthTicket"
        slug:
          $ref: "#/components/schemas/Slug"
