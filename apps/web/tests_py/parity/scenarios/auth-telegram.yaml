name: auth-telegram
steps:
  - reset: true
    request: { method: POST, path: /api/auth/telegram-guest, json: <idTokenPayload> }
    note: valid id_token → 200 guest ticket
  - request: { method: POST, path: /api/auth/telegram-signup, json: <idTokenPayload> }
    note: valid id_token → 200 auth ticket + organizerExists flag
  - request:
      method: POST
      path: /api/auth/telegram-guest
      json: { idToken: x.y.z, nonceVerifier: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa }
    note: undecodable/forged token → 400
  - request: { method: POST, path: /api/auth/telegram-guest, json: {} }
    note: empty body → 400 validation error
  - request: { method: POST, path: /api/auth/telegram-guest, json: <idTokenPayload> }
    repeat: 10
    note: exhaust the 10/min guest bucket (fresh token per repeat —
      placeholders resolve inside the loop)
  - request: { method: POST, path: /api/auth/telegram-guest, json: <idTokenPayload> }
    note: 11th call → 429
