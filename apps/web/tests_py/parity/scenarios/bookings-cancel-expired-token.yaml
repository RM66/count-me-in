name: bookings-cancel-expired-token
steps:
  - reset: true
    mint: session
    request:
      method: POST
      path: /api/services
      headers: { X-Organizer-Auth: <session> }
      json:
        {
          title: Expired Host,
          defaultPrice: '20.00',
          defaultCapacity: 5,
          defaultDurationMinutes: 60,
          maxSeatsPerBooking: 4,
        }
    note: seed service; capture <serviceId>
  - request:
      method: POST
      path: /api/slots
      headers: { X-Organizer-Auth: <session> }
      json:
        {
          serviceId: <serviceId>,
          startsAt: '2031-10-15T10:00:00Z',
          durationMinutes: 60,
          capacity: 5,
        }
    note: seed slot; capture <slotId>
  - mint: guestTicket
    request:
      method: POST
      path: /api/bookings
      json:
        {
          guestTicket: <guestTicket>,
          serviceId: <serviceId>,
          timeSlotId: <slotId>,
          seats: 1,
          guestName: Expired Guest,
        }
    note: create booking; capture <manageToken>
    expectSink: 2
  - expireManageToken: true
    request:
      method: POST
      path: /api/bookings/cancel
      json: { manageToken: <manageToken> }
    note: recorder expires the token in DB before this step (manage_token_expires_at forced into the past) → refused
    expectSink: 0
