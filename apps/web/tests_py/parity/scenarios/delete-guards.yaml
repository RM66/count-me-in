name: delete-guards
steps:
  - reset: true
    mint: session
    request:
      method: POST
      path: /api/services
      headers: { X-Organizer-Auth: <session> }
      json:
        {
          title: Guard Host,
          defaultPrice: '20.00',
          defaultCapacity: 5,
          defaultDurationMinutes: 60,
          maxSeatsPerBooking: 4,
        }
    note: seed service; capture <serviceId>
  - request:
      method: POST
      path: /api/slots
      headers: { X-Organizer-Auth: <session> }
      json:
        {
          serviceId: <serviceId>,
          startsAt: '2031-12-01T10:00:00Z',
          durationMinutes: 60,
          capacity: 5,
        }
    note: seed slot; capture <slotId>
  - mint: guestTicket
    request:
      method: POST
      path: /api/bookings
      json:
        {
          guestTicket: <guestTicket>,
          serviceId: <serviceId>,
          timeSlotId: <slotId>,
          seats: 1,
          guestName: Guard Guest,
        }
    note: create a booking referencing the slot
    expectSink: 2
  - request:
      method: DELETE
      path: /api/slots/<slotId>
      headers: { X-Organizer-Auth: <session> }
    note: slot referenced by a booking (confirmed) → 409
  - request:
      method: POST
      path: /api/bookings/cancel
      json: { manageToken: <manageToken> }
    note: cancel the booking (row stays, status cancelled)
    expectSink: 1
  - request:
      method: DELETE
      path: /api/slots/<slotId>
      headers: { X-Organizer-Auth: <session> }
    note: slot referenced by a CANCELLED booking → still 409 (bookings are guest history)
  - request:
      method: DELETE
      path: /api/services/<serviceId>
      headers: { X-Organizer-Auth: <session> }
    note: service referenced by a booking → 409
