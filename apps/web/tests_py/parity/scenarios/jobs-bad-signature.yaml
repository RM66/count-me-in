name: jobs-bad-signature
steps:
  - reset: true
  - mint: qstashSignatureBad
    request:
      method: POST
      path: /api/jobs/booking.created
      body_raw: '{"bookingId":"01930000-0000-7000-8000-000000000001","recipient":"organizer","outboxId":"01930000-0000-7000-8000-000000000002"}'
    note: signature minted over a DIFFERENT body (recorder mints over mismatched bytes) → 401 body-hash mismatch
