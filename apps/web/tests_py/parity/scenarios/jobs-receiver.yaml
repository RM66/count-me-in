name: jobs-receiver
steps:
  - reset: true
  - request:
      method: POST
      path: /api/jobs/booking.created
      body_raw: '{"bookingId":"00000000-0000-0000-0000-000000000001","recipient":"organizer","outboxId":"00000000-0000-0000-0000-000000000002"}'
    note: missing upstash-signature → 401
  - request:
      method: POST
      path: /api/jobs/booking.created
      headers: { upstash-signature: garbage }
      body_raw: '{"bookingId":"00000000-0000-0000-0000-000000000001","recipient":"organizer","outboxId":"00000000-0000-0000-0000-000000000002"}'
    note: malformed signature → 401
  - mint: qstashSignature
    request:
      method: POST
      path: /api/jobs/unknown.queue
      body_raw: '{}'
    note: unknown queue → 404
  - mint: qstashSignature
    request:
      method: POST
      path: /api/jobs/booking.created
      body_raw: '{"bookingId":"not-a-uuid","recipient":"organizer","outboxId":"00000000-0000-0000-0000-000000000002"}'
    note: invalid payload → 400 (retrying would resend the same bytes)
  - mint: qstashSignature
    request:
      method: POST
      path: /api/jobs/booking.created
      body_raw: '{"bookingId":"00000000-0000-0000-0000-000000000001","recipient":"organizer","outboxId":"00000000-0000-0000-0000-000000000002"}'
    note: valid signed delivery, unknown booking → 200 silent skip (no resend)
  - mint: qstashSignature
    request:
      method: POST
      path: /api/jobs/booking.created
      body_raw: '{"bookingId":"00000000-0000-0000-0000-000000000001","recipient":"organizer","outboxId":"00000000-0000-0000-0000-000000000002"}'
    note: duplicate outboxId delivery → 200, no second send (idempotency claim)
  - mint: qstashSignature
    request:
      method: POST
      path: /api/jobs/demo.refresh
      body_raw: '{}'
    note: schedule queue accepts empty body → 200 (reseed)
  - mint: qstashSignature
    request:
      method: POST
      path: /api/jobs/notification.outbox.sweep
      body_raw: '{}'
    note: schedule queue accepts empty body → 200
