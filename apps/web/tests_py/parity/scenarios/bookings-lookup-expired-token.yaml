name: bookings-lookup-expired-token
steps:
  - reset: true
    mint: session
    request:
      method: POST
      path: /api/services
      headers: { X-Organizer-Auth: <session> }
      json:
        {
          title: Expired Lookup Host,
          defaultPrice: '20.00',
          defaultCapacity: 5,
          defaultDurationMinutes: 60,
          maxSeatsPerBooking: 4,
        }
    note: seed service; capture <serviceId>
  - request:
      method: POST
      path: /api/slots
      headers: { X-Organizer-Auth: <session> }
      json:
        {
          serviceId: <serviceId>,
          startsAt: '2031-10-20T10:00:00Z',
          durationMinutes: 60,
          capacity: 5,
        }
    note: seed slot; capture <slotId>
  - mint: guestTicket
    request:
      method: POST
      path: /api/bookings
      json:
        {
          guestTicket: <guestTicket>,
          serviceId: <serviceId>,
          timeSlotId: <slotId>,
          seats: 1,
          guestName: Expired Lookup Guest,
        }
    expectSink: 2
    note: create booking; capture <bookingId> + <manageToken>
  - expireManageToken: true
    mint: guestTicket
    request:
      method: POST
      path: /api/bookings/lookup
      json: { guestTicket: <guestTicket> }
    note: 'expired manage token refused on READ — the booking stays listed but carries canCancel: false (ADR-020; the guest list must never drop rows)'
